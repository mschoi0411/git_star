<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Top 10 로컬 실습 흐름</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45, 49, 66, 0.14);
      --accent: #bf4520;
      --accent-tint: rgba(191, 69, 32, 0.08);
      --link: #2e5aa8;
      --sans: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      --serif: Georgia, "Noto Serif KR", serif;
      --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
    }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 56px 32px 48px;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 760px;
      margin: 0 0 14px;
      font-family: var(--serif);
      font-size: clamp(32px, 5vw, 54px);
      font-weight: 400;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }
    .lede {
      max-width: 720px;
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }
    .diagram-container {
      width: 100%;
      overflow-x: auto;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      scrollbar-color: var(--muted) transparent;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 960px;
    }
    .notes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 28px;
    }
    .notes section {
      padding-top: 16px;
      border-top: 1px solid var(--rule);
    }
    .notes h2 {
      margin: 0 0 8px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .notes p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    code { font-family: var(--mono); color: var(--ink); }
    @media (max-width: 640px) {
      main { padding: 36px 20px 32px; }
      .notes { grid-template-columns: 1fr; }
    }
    @media print {
      main { width: 100%; padding: 24px; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Architecture · 10 Repository Learning Lab</p>

      </section>
